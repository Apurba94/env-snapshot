[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "env-snapshot"
version = "0.1.0"
description = "Capture OS, Python version, installed packages and git state into a reproducibility record."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "JANIN A APURBA", email = "japurba97@gmail.com"}]
keywords = ["research", "automation", "reproducibility", "academic"]
dependencies = []

[project.scripts]
env-snapshot = "env_snapshot.cli:main"

[tool.setuptools]
packages = ["env_snapshot"]
